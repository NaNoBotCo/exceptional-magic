<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 664" width="560" height="664" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,sans-serif"><title id="t">The three eight-dimensional representations of so(8) under triality</title><desc id="d">Twenty-four dots in three colours arranged with three-fold symmetry; a third of a turn carries each colour onto the next.</desc><rect width="560" height="664" fill="#0a0a10"/><text x="290.0" y="34.0" fill="#f2ede3" font-size="19" text-anchor="middle" font-weight="700">Triality is a third of a turn</text><text x="290.0" y="54.0" fill="#9d9689" font-size="12.5" text-anchor="middle" font-weight="400">the three eight-dimensional faces of so(8), in the plane where the symmetry rotates</text><circle cx="290.0" cy="290.0" r="210.0" fill="none" stroke="#2c2c3a"/><line x1="290.0" y1="290.0" x2="290.0" y2="62.0" stroke="#2c2c3a" stroke-dasharray="3 5"/><line x1="290.0" y1="290.0" x2="92.5" y2="404.0" stroke="#2c2c3a" stroke-dasharray="3 5"/><line x1="290.0" y1="290.0" x2="487.5" y2="404.0" stroke="#2c2c3a" stroke-dasharray="3 5"/><circle cx="290.0" cy="411.2" r="7" fill="#ffc247" fill-opacity=".92"/><circle cx="290.0" cy="168.8" r="7" fill="#ffc247" fill-opacity=".92"/><circle cx="290.0" cy="168.8" r="7" fill="#ffc247" fill-opacity=".92"/><circle cx="290.0" cy="411.2" r="7" fill="#ffc247" fill-opacity=".92"/><circle cx="290.0" cy="168.8" r="7" fill="#ffc247" fill-opacity=".92"/><circle cx="290.0" cy="411.2" r="7" fill="#ffc247" fill-opacity=".92"/><circle cx="500.0" cy="290.0" r="7" fill="#ffc247" fill-opacity=".92"/><circle cx="80.0" cy="290.0" r="7" fill="#ffc247" fill-opacity=".92"/><circle cx="185.0" cy="229.4" r="7" fill="#5fd3c6" fill-opacity=".92"/><circle cx="395.0" cy="350.6" r="7" fill="#5fd3c6" fill-opacity=".92"/><circle cx="395.0" cy="350.6" r="7" fill="#5fd3c6" fill-opacity=".92"/><circle cx="185.0" cy="471.9" r="7" fill="#5fd3c6" fill-opacity=".92"/><circle cx="395.0" cy="108.1" r="7" fill="#5fd3c6" fill-opacity=".92"/><circle cx="185.0" cy="229.4" r="7" fill="#5fd3c6" fill-opacity=".92"/><circle cx="185.0" cy="229.4" r="7" fill="#5fd3c6" fill-opacity=".92"/><circle cx="395.0" cy="350.6" r="7" fill="#5fd3c6" fill-opacity=".92"/><circle cx="395.0" cy="229.4" r="7" fill="#ff7ab6" fill-opacity=".92"/><circle cx="185.0" cy="350.6" r="7" fill="#ff7ab6" fill-opacity=".92"/><circle cx="185.0" cy="350.6" r="7" fill="#ff7ab6" fill-opacity=".92"/><circle cx="395.0" cy="471.9" r="7" fill="#ff7ab6" fill-opacity=".92"/><circle cx="185.0" cy="108.1" r="7" fill="#ff7ab6" fill-opacity=".92"/><circle cx="395.0" cy="229.4" r="7" fill="#ff7ab6" fill-opacity=".92"/><circle cx="395.0" cy="229.4" r="7" fill="#ff7ab6" fill-opacity=".92"/><circle cx="185.0" cy="350.6" r="7" fill="#ff7ab6" fill-opacity=".92"/><rect x="18" y="568" width="12" height="12" fill="#ffc247"/><text x="36.0" y="579.0" fill="#9d9689" font-size="12.5" text-anchor="start" font-weight="400">8v — vectors</text><rect x="18" y="590" width="12" height="12" fill="#5fd3c6"/><text x="36.0" y="601.0" fill="#9d9689" font-size="12.5" text-anchor="start" font-weight="400">8c — one spinor</text><rect x="18" y="612" width="12" height="12" fill="#ff7ab6"/><text x="36.0" y="623.0" fill="#9d9689" font-size="12.5" text-anchor="start" font-weight="400">8s — the other spinor</text><text x="18.0" y="652.0" fill="#9d9689" font-size="12.5" text-anchor="start" font-weight="400">turn the page 120° and the colours trade places</text></svg>