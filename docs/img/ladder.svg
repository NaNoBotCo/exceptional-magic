<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,sans-serif"><title id="t">The four division algebras and the laws each one keeps</title><desc id="d">A table: the reals keep every law; the complex numbers lose nothing yet; the quaternions stop commuting; the octonions stop associating but stay alternative and keep the norm law; the sedenions lose the norm law as well.</desc><rect width="900" height="420" fill="#0a0a10"/><rect width="900" height="420" fill="#0a0a10"/><text x="24.0" y="38.0" fill="#f2ede3" font-size="21" text-anchor="start" font-weight="700">Every doubling costs you something</text><text x="24.0" y="60.0" fill="#9d9689" font-size="12.5" text-anchor="start" font-weight="400">measured on 2,000 random triples per algebra, exact integer arithmetic</text><text x="316.0" y="86.0" fill="#9d9689" font-size="12" text-anchor="middle" font-weight="600" font-family="ui-monospace,Menlo,monospace">ab = ba</text><text x="448.0" y="86.0" fill="#9d9689" font-size="12" text-anchor="middle" font-weight="600" font-family="ui-monospace,Menlo,monospace">(ab)c = a(bc)</text><text x="580.0" y="86.0" fill="#9d9689" font-size="12" text-anchor="middle" font-weight="600" font-family="ui-monospace,Menlo,monospace">(aa)b = a(ab)</text><text x="712.0" y="86.0" fill="#9d9689" font-size="12" text-anchor="middle" font-weight="600" font-family="ui-monospace,Menlo,monospace">|ab| = |a||b|</text><rect x="24" y="96" width="852" height="38" rx="6" fill="#12121c"/><text x="40.0" y="123.0" fill="#f2ede3" font-size="15" text-anchor="start" font-weight="600">the reals</text><text x="232.0" y="123.0" fill="#7e8aa0" font-size="17" text-anchor="end" font-weight="800">1</text><rect x="250" y="104" width="118" height="22" rx="4" fill="#7e8aa0" opacity="0.9"/><text x="309.0" y="126.0" fill="#0a0a10" font-size="12" text-anchor="middle" font-weight="700">holds</text><rect x="382" y="104" width="118" height="22" rx="4" fill="#7e8aa0" opacity="0.9"/><text x="441.0" y="126.0" fill="#0a0a10" font-size="12" text-anchor="middle" font-weight="700">holds</text><rect x="514" y="104" width="118" height="22" rx="4" fill="#7e8aa0" opacity="0.9"/><text x="573.0" y="126.0" fill="#0a0a10" font-size="12" text-anchor="middle" font-weight="700">holds</text><rect x="646" y="104" width="118" height="22" rx="4" fill="#7e8aa0" opacity="0.9"/><text x="705.0" y="126.0" fill="#0a0a10" font-size="12" text-anchor="middle" font-weight="700">holds</text><rect x="24" y="140" width="852" height="38" rx="6" fill="#12121c"/><text x="40.0" y="167.0" fill="#f2ede3" font-size="15" text-anchor="start" font-weight="600">the complex numbers</text><text x="232.0" y="167.0" fill="#5fd3c6" font-size="17" text-anchor="end" font-weight="800">2</text><rect x="250" y="148" width="118" height="22" rx="4" fill="#5fd3c6" opacity="0.9"/><text x="309.0" y="170.0" fill="#0a0a10" font-size="12" text-anchor="middle" font-weight="700">holds</text><rect x="382" y="148" width="118" height="22" rx="4" fill="#5fd3c6" opacity="0.9"/><text x="441.0" y="170.0" fill="#0a0a10" font-size="12" text-anchor="middle" font-weight="700">holds</text><rect x="514" y="148" width="118" height="22" rx="4" fill="#5fd3c6" opacity="0.9"/><text x="573.0" y="170.0" fill="#0a0a10" font-size="12" text-anchor="middle" font-weight="700">holds</text><rect x="646" y="148" width="118" height="22" rx="4" fill="#5fd3c6" opacity="0.9"/><text x="705.0" y="170.0" fill="#0a0a10" font-size="12" text-anchor="middle" font-weight="700">holds</text><rect x="24" y="184" width="852" height="38" rx="6" fill="#12121c"/><text x="40.0" y="211.0" fill="#f2ede3" font-size="15" text-anchor="start" font-weight="600">the quaternions</text><text x="232.0" y="211.0" fill="#b79cff" font-size="17" text-anchor="end" font-weight="800">4</text><rect x="250" y="192" width="118" height="22" rx="4" fill="#2a2a38" opacity="1"/><text x="309.0" y="214.0" fill="#9d9689" font-size="12" text-anchor="middle" font-weight="700">10 of 2,000</text><rect x="382" y="192" width="118" height="22" rx="4" fill="#b79cff" opacity="0.9"/><text x="441.0" y="214.0" fill="#0a0a10" font-size="12" text-anchor="middle" font-weight="700">holds</text><rect x="514" y="192" width="118" height="22" rx="4" fill="#b79cff" opacity="0.9"/><text x="573.0" y="214.0" fill="#0a0a10" font-size="12" text-anchor="middle" font-weight="700">holds</text><rect x="646" y="192" width="118" height="22" rx="4" fill="#b79cff" opacity="0.9"/><text x="705.0" y="214.0" fill="#0a0a10" font-size="12" text-anchor="middle" font-weight="700">holds</text><rect x="24" y="228" width="852" height="38" rx="6" fill="#12121c"/><text x="40.0" y="255.0" fill="#f2ede3" font-size="15" text-anchor="start" font-weight="600">the octonions</text><text x="232.0" y="255.0" fill="#ffc247" font-size="17" text-anchor="end" font-weight="800">8</text><rect x="250" y="236" width="118" height="22" rx="4" fill="#2a2a38" opacity="1"/><text x="309.0" y="258.0" fill="#9d9689" font-size="12" text-anchor="middle" font-weight="700">never</text><rect x="382" y="236" width="118" height="22" rx="4" fill="#2a2a38" opacity="1"/><text x="441.0" y="258.0" fill="#9d9689" font-size="12" text-anchor="middle" font-weight="700">never</text><rect x="514" y="236" width="118" height="22" rx="4" fill="#ffc247" opacity="0.9"/><text x="573.0" y="258.0" fill="#0a0a10" font-size="12" text-anchor="middle" font-weight="700">holds</text><rect x="646" y="236" width="118" height="22" rx="4" fill="#ffc247" opacity="0.9"/><text x="705.0" y="258.0" fill="#0a0a10" font-size="12" text-anchor="middle" font-weight="700">holds</text><rect x="24" y="272" width="852" height="38" rx="6" fill="#12121c"/><text x="40.0" y="299.0" fill="#f2ede3" font-size="15" text-anchor="start" font-weight="600">the sedenions</text><text x="232.0" y="299.0" fill="#b79cff" font-size="17" text-anchor="end" font-weight="800">16</text><rect x="250" y="280" width="118" height="22" rx="4" fill="#2a2a38" opacity="1"/><text x="309.0" y="302.0" fill="#9d9689" font-size="12" text-anchor="middle" font-weight="700">never</text><rect x="382" y="280" width="118" height="22" rx="4" fill="#2a2a38" opacity="1"/><text x="441.0" y="302.0" fill="#9d9689" font-size="12" text-anchor="middle" font-weight="700">never</text><rect x="514" y="280" width="118" height="22" rx="4" fill="#2a2a38" opacity="1"/><text x="573.0" y="302.0" fill="#9d9689" font-size="12" text-anchor="middle" font-weight="700">never</text><rect x="646" y="280" width="118" height="22" rx="4" fill="#2a2a38" opacity="1"/><text x="705.0" y="302.0" fill="#9d9689" font-size="12" text-anchor="middle" font-weight="700">never</text><text x="24.0" y="346.0" fill="#9d9689" font-size="12.5" text-anchor="start" font-weight="400">Past eight, two things that are not zero can multiply to zero: (e1 + e10)(e5 + e14) = 0 — 84 such pairs of basis planes.</text></svg>