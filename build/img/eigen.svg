<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 436" width="920" height="436" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,sans-serif"><title id="t">The three-way split of each triality algebra</title><desc id="d">Six stacked bars, one each for su(3), sp(3), f4, e6, e7 and e8. Each bar has a fixed part and two equal moving parts whose lengths add to the algebra's dimension.</desc><rect width="920" height="436" fill="#0a0a10"/><text x="24.0" y="38.0" fill="#f2ede3" font-size="21" text-anchor="start" font-weight="700">Cut three ways</text><text x="24.0" y="58.0" fill="#9d9689" font-size="12.5" text-anchor="start" font-weight="400">a triality automorphism splits each of these into a fixed part and two equal halves that trade places</text><text x="24.0" y="122.0" fill="#f2ede3" font-size="17" text-anchor="start" font-weight="800">su(3)</text><text x="178.0" y="122.0" fill="#9d9689" font-size="13.5" text-anchor="end" font-weight="400">8</text><rect x="190" y="104" width="3.9" height="26" fill="#ffc247"/><rect x="193.9" y="104" width="5.8" height="26" fill="#5fd3c6"/><rect x="199.7" y="104" width="5.8" height="26" fill="#ff7ab6"/><text x="191.9" y="122.0" fill="#0a0a10" font-size="12.5" text-anchor="middle" font-weight="700">2</text><text x="196.8" y="122.0" fill="#0a0a10" font-size="12.5" text-anchor="middle" font-weight="700">3</text><text x="202.6" y="122.0" fill="#0a0a10" font-size="12.5" text-anchor="middle" font-weight="700">3</text><text x="686.0" y="122.0" fill="#9d9689" font-size="11.5" text-anchor="start" font-weight="400">u(1) + u(1)</text><text x="24.0" y="168.0" fill="#f2ede3" font-size="17" text-anchor="start" font-weight="800">sp(3)</text><text x="178.0" y="168.0" fill="#9d9689" font-size="13.5" text-anchor="end" font-weight="400">21</text><rect x="190" y="150" width="13.5" height="26" fill="#ffc247"/><rect x="203.5" y="150" width="13.5" height="26" fill="#5fd3c6"/><rect x="217.1" y="150" width="13.5" height="26" f