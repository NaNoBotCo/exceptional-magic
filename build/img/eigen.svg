"686.0" y="260.0" fill="#9d9689" font-size="11.5" text-anchor="start" font-weight="400">so(8) + u(1) + u(1)</text><text x="24.0" y="306.0" fill="#f2ede3" font-size="17" text-anchor="start" font-weight="800">e7</text><text x="178.0" y="306.0" fill="#9d9689" font-size="13.5" text-anchor="end" font-weight="400">133</text><rect x="190" y="288" width="94.8" height="26" fill="#ffc247"/><rect x="284.8" y="288" width="81.3" height="26" fill="#5fd3c6"/><rect x="366.1" y="288" width="81.3" height="26" fill="#ff7ab6"/><text x="237.4" y="306.0" fill="#0a0a10" font-size="12.5" text-anchor="middle" font-weight="700">49</text><text x="325.5" y="306.0" fill="#0a0a10" font-size="12.5" text-anchor="middle" font-weight="700">42</text><text x="406.8" y="306.0" fill="#0a0a10" font-size="12.5" text-anchor="middle" font-weight="700">42</text><text x="686.0" y="306.0" fill="#9d9689" font-size="11.5" text-anchor="start" font-weight="400">so(10) + su(2) + u(1)</text><text x="24.0" y="352.0" fill="#f2ede3" font-size="17" text-anchor="start" font-weight="800">e8</text><text x="178.0" y="352.0" fill="#9d9689" font-size="13.5" text-anchor="end" font-weight="400">248</text><rect x="190" y="334" width="178.1" height="26" fill="#ffc247"/><rect x="368.1" y="334" width="151.0" height="26" fill="#5fd3c6"/><rect x="519.0" y="334" width="151.0" height="26" fill="#ff7ab6"/><text x="279.0" y="352.0" fill="#0a0a10" font-size="12.5" text-anchor="middle" font-weight="700">92</text><text x="443.5" y="352.0" fill="#0a0a10" font-size="12.5" text-anchor="middle" font-weight="700">78</text><text x="594.5" y="352.0" fill="#0a0a10" font-size="12.5" text-anchor="middle" font-weight="700">78</text><text x="686.0" y="352.0" fill="#9d9689" font-size="11.5" text-anchor="start" font-weight="400">so(14) + u(1)</text><text x="24.0" y="410.0" fill="#9d9689" font-size="12.5" text-anchor="start" font-weight="400">the fixed part is a subalgebra; the two halves are where the three generations would live</text></svg>