<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,sans-serif"><title id="t">The four triality Lie algebras</title><desc id="d">Four boxes: su(2) is 0 plus three ones; su(3) is 2 plus three twos; sp(3) is 9 plus three fours; f4 is 28 plus three eights, which is fifty-two.</desc><rect width="880" height="250" fill="#0a0a10"/><text x="24.0" y="38.0" fill="#f2ede3" font-size="21" text-anchor="start" font-weight="700">One shape, four sizes</text><text x="24.0" y="58.0" fill="#9d9689" font-size="12.5" text-anchor="start" font-weight="400">tri(D) plus three copies of D — the triality Lie algebras</text><rect x="40" y="100" width="180" height="94" rx="8" fill="#12121c" stroke="#7e8aa0"/><text x="130.0" y="128.0" fill="#f2ede3" font-size="20" text-anchor="middle" font-weight="800">su(2)</text><text x="130.0" y="152.0" fill="#7e8aa0" font-size="14" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,monospace">0 + 3 × 1 = 3</text><text x="130.0" y="176.0" fill="#9d9689" font-size="12" text-anchor="middle" font-weight="400">tri(R) + R+R+R</text><text x="130.0" y="212.0" fill="#9d9689" font-size="12" text-anchor="middle" font-weight="400">the reals</text><rect x="240" y="100" width="180" height="94" rx="8" fill="#12121c" stroke="#5fd3c6"/><text x="330.0" y="128.0" fill="#f2ede3" font-size="20" text-anchor="middle" font-weight="800">su(3)</text><text x="330.0" y="152.0" fill="#5fd3c6" font-size="14" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,monospace">2 + 3 × 2 = 8</text><text x="330.0" y="176.0" fill="#9d9689" font-size="12" text-anchor="middle" font-weight="400">tri(C) + C+C+C</text><text x="330.0" y="212.0" fill="#9d9689" font-size="12" text-anchor="middle" font-weight="400">the complex numbers</text><rect x="440" y="100" width="180" height="94" rx="8" fill="#12121c" stroke="#b79cff"/><text x="530.0" y="128.0" fill="#f2ede3" font-size="20" text-anchor="middle" font-weight="800">sp(3)</text><text x="530.0" y="152.0" fill="#b79cff" font-size="14" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,monospace">9 + 3 × 4 = 21</text><text x="530.0" y="176.0" fill="#9d9689" font-size="12" text-anchor="middle" font-weight="400">tri(H) + H+H+H</text><text x="530.0" y="212.0" fill="#9d9689" font-size="12" text-anchor="middle" font-weight="400">the quaternions</text><rect x="640" y="100" width="180" height="94" rx="8" fill="#12121c" stroke="#ffc247"/><text x="730.0" y="128.0" fill="#f2ede3" font-size="20" text-anchor="middle" font-weight="800">f4</text><text x="730.0" y="152.0" fill="#ffc247" font-size="14" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,monospace">28 + 3 × 8 = 52</text><text x="730.0" y="176.0" fill="#9d9689" font-size="12" text-anchor="middle" font-weight="400">tri(O) + O+O+O</text><text x="730.0" y="212.0" fill="#9d9689" font-size="12" text-anchor="middle" font-weight="400">the octonions</text></svg>