<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,sans-serif"><title id="t">The Fano plane of the octonion units</title><desc id="d">Seven circles labelled e1 to e7 at the corners, edge midpoints and centre of a triangle, joined by three sides, three medians and one inner circle. Each of the seven lines carries arrows showing the cyclic order of multiplication.</desc><rect width="560" height="560" fill="#0a0a10"/><text x="280.0" y="38.0" fill="#f2ede3" font-size="19" text-anchor="middle" font-weight="700">The octonion table is a seven-point plane</text><text x="280.0" y="58.0" fill="#9d9689" font-size="12" text-anchor="middle" font-weight="400">seven points, seven lines, three points on every line, three lines through every point</text><line x1="280.0" y1="91.0" x2="457.5" y2="398.5" stroke="#2c2c3a" stroke-width="2.5"/><line x1="280.0" y1="91.0" x2="102.5" y2="398.5" stroke="#2c2c3a" stroke-width="2.5"/><line x1="280.0" y1="91.0" x2="280.0" y2="398.5" stroke="#2c2c3a" stroke-width="2.5"/><line x1="457.5" y1="398.5" x2="102.5" y2="398.5" stroke="#2c2c3a" stroke-width="2.5"/><line x1="457.5" y1="398.5" x2="191.2" y2="244.8" stroke="#2c2c3a" stroke-width="2.5"/><line x1="102.5" y1="398.5" x2="368.8" y2="244.8" stroke="#2c2c3a" stroke-width="2.5"/><circle cx="280.0" cy="296.0" r="102.5" fill="none" stroke="#2c2c3a" stroke-width="2.5"/><path d="M417.9,319.9 L405.6,308.5 L409.3,324.9" fill="none" stroke="#ffc247" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M336.2,178.5 L323.9,167.1 L327.6,183.4" fill="none" stroke="#ffc247" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M150.7,324.9 L154.4,308.5 L142.1,319.9" fill="none" stroke="#ffc247" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M232.4,183.4 L236.1,167.1 L223.8,178.5" fill="none" stroke="#ffc247" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M285.0,323.5 L280.0,307.5 L275.0,323.5" fill="none" stroke="#ffc247" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M285.0,182.0 L280.0,166.0 L275.0,182.0" fill="none" stroke="#ffc247" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M190.3,403.5 L206.3,398.5 L190.3,393.5" fill="none" stroke="#ffc247" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M353.7,403.5 L369.7,398.5 L353.7,393.5" fill="none" stroke="#ffc247" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M395.0,356.7 L378.7,353.0 L390.1,365.3" fill="none" stroke="#ffc247" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M272.5,286.0 L256.2,282.3 L267.6,294.6" fill="none" stroke="#ffc247" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M301.3,278.0 L289.9,290.3 L306.3,286.6" fill="none" stroke="#ffc247" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M178.8,348.7 L167.4,361.0 L183.8,357.3" fill="none" stroke="#ffc247" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M377.5,287.6 L382.5,303.6 L387.4,287.6" fill="none" stroke="#ffc247" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M238.5,384.6 L222.1,381.0 L233.5,393.2" fill="none" stroke="#ffc247" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M224.0,215.7 L235.3,203.4 L219.0,207.2" fill="none" stroke="#ffc247" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="280.0" cy="91.0" r="17" fill="#0a0a10" stroke="#5fd3c6" stroke-width="2.5"/><text x="280.0" y="96.0" fill="#f2ede3" font-size="14" text-anchor="middle" font-weight="700">e1</text><circle cx="457.5" cy="398.5" r="17" fill="#0a0a10" stroke="#5fd3c6" stroke-width="2.5"/><text x="457.5" y="403.5" fill="#f2ede3" font-size="14" text-anchor="middle" font-weight="700">e2</text><circle cx="102.5" cy="398.5" r="17" fill="#0a0a10" stroke="#5fd3c6" stroke-width="2.5"/><text x="102.5" y="403.5" fill="#f2ede3" font-size="14" text-anchor="middle" font-weight="700">e3</text><circle cx="368.8" cy="244.8" r="17" fill="#0a0a10" stroke="#5fd3c6" stroke-width="2.5"/><text x="368.8" y="249.8" fill="#f2ede3" font-size="14" text-anchor="middle" font-weight="700">e4</text><circle cx="280.0" cy="398.5" r="17" fill="#0a0a10" stroke="#5fd3c6" stroke-width="2.5"/><text x="280.0" y="403.5" fill="#f2ede3" font-size="14" text-anchor="middle" font-weight="700">e5</text><circle cx="280.0" cy="296.0" r="17" fill="#0a0a10" stroke="#5fd3c6" stroke-width="2.5"/><text x="280.0" y="301.0" fill="#f2ede3" font-size="14" text-anchor="middle" font-weight="700">e6</text><circle cx="191.2" cy="244.8" r="17" fill="#0a0a10" stroke="#5fd3c6" stroke-width="2.5"/><text x="191.2" y="249.8" fill="#f2ede3" font-size="14" text-anchor="middle" font-weight="700">e7</text><text x="280.0" y="546.0" fill="#9d9689" font-size="12" text-anchor="middle" font-weight="400">follow an arrow: e1 e2 = e4, and go against it for a minus sign</text></svg>