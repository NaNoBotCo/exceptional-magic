<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,sans-serif"><title id="t">Triality as a 120 degree rotation</title><desc id="d">A circle with three spokes at 120 degrees, labelled I, II and III, beside the two by two rotation matrix that carries one spoke to the next.</desc><rect width="760" height="400" fill="#0a0a10"/><text x="24.0" y="38.0" fill="#f2ede3" font-size="20" text-anchor="start" font-weight="700">A third of a turn, three times over</text><text x="24.0" y="58.0" fill="#9d9689" font-size="12.5" text-anchor="start" font-weight="400">each pair of eigenvectors spans a plane that triality rotates by 120°</text><circle cx="210" cy="220" r="100" fill="none" stroke="#2c2c3a"/><line x1="210" y1="220" x2="210.0" y2="120.0" stroke="#ffc247" stroke-width="3"/><circle cx="210.0" cy="120.0" r="8" fill="#ffc247"/><text x="210.0" y="99.0" fill="#ffc247" font-size="15" text-anchor="middle" font-weight="700">I</text><line x1="210" y1="220" x2="123.4" y2="270.0" stroke="#5fd3c6" stroke-width="3"/><circle cx="123.4" cy="270.0" r="8" fill="#5fd3c6"/><text x="100.9" y="288.0" fill="#5fd3c6" font-size="15" text-anchor="middle" font-weight="700">II</text><line x1="210" y1="220" x2="296.6" y2="270.0" stroke="#ff7ab6" stroke-width="3"/><circle cx="296.6" cy="270.0" r="8" fill="#ff7ab6"/><text x="319.1" y="288.0" fill="#ff7ab6" font-size="15" text-anchor="middle" font-weight="700">III</text><text x="210.0" y="382.0" fill="#9d9689" font-size="12.5" text-anchor="middle" font-weight="400">generation I, II, III — if the guess is right</text><text x="420.0" y="150.0" fill="#9d9689" font-size="12.5" text-anchor="start" font-weight="400">the matrix triality applies to the pair</text><text x="420.0" y="186.0" fill="#f2ede3" font-size="16" text-anchor="start" font-weight="600" font-family="ui-monospace,Menlo,monospace">⎡ −1/2   −√3/2 ⎤</text><text x="420.0" y="214.0" fill="#f2ede3" font-size="16" text-anchor="start" font-weight="600" font-family="ui-monospace,Menlo,monospace">⎣  √3/2  −1/2  ⎦</text><text x="420.0" y="258.0" fill="#9d9689" font-size="12.5" text-anchor="start" font-weight="400">apply it three times and you are back where you started</text><text x="420.0" y="280.0" fill="#9d9689" font-size="11.5" text-anchor="start" font-weight="400">Lisi §6 — the (V^R, V^I) plane of each eigenvector pair</text></svg>